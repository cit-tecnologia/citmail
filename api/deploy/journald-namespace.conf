# Retenção dos logs técnicos da API (ADR 0013, item 8; CIT-55): até 30 dias.
# Instalado na VPS (#57/#93) como /etc/systemd/journald@citmail.conf (produção)
# e /etc/systemd/journald@citmail-homolog.conf (homologação); a unidade systemd
# da API e a do worker de cada ambiente usam LogNamespace=<namespace>.
# Requer systemd >= 245.
# O journald apaga arquivo inteiro: 29 dias + arquivo de até 1 dia = até 30 dias.
# SystemMaxUse é teto de disco por namespace (idade ou tamanho, o que vier antes).
[Journal]
Storage=persistent
MaxRetentionSec=29day
MaxFileSec=1day
SystemMaxUse=1G
# Sem syslog: encaminhar levaria o log para a retenção do logrotate, fora dos 30 dias.
ForwardToSyslog=no
